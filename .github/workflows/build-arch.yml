name: Nettool executable builds

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Extract ZIP and build Linux executables
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake unzip qt6-base-dev

      - name: Extract uploaded source ZIP
        shell: bash
        run: |
          ARCHIVE="nettool-3.0.0 (1).zip"
          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Missing $ARCHIVE in the repository root."
            echo "Upload this ZIP to the repository root, then rerun this workflow."
            exit 1
          fi

          mkdir -p source
          unzip -oq "$ARCHIVE" -d source

          CMAKE_FILE="$(find source -type f -name CMakeLists.txt -print -quit)"
          if [[ -z "$CMAKE_FILE" ]]; then
            echo "::error::CMakeLists.txt was not found inside $ARCHIVE"
            exit 1
          fi

          SRC_DIR="$(dirname "$CMAKE_FILE")"
          echo "NETTOOL_SOURCE_DIR=$SRC_DIR" >> "$GITHUB_ENV"
          echo "Extracted source into: $SRC_DIR"

      - name: Configure
        run: |
          cmake -S "$NETTOOL_SOURCE_DIR" -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNETTOOL_GUI=ON

      - name: Compile CLI and GUI executables
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify executables
        run: |
          test -x build/nettool-cli
          test -x build/nettool-gui
          file build/nettool-cli build/nettool-gui

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: nettool-linux-x86_64
          path: |
            build/nettool-cli
            build/nettool-gui
          if-no-files-found: error
